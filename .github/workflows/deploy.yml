name: Deploy to ACR

on:
  push:
    branches: [Main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v5

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name budgetappacr

      - name: Build and Push
        run: |
          docker build -t budgetappacr.azurecr.io/budget-app:${{ github.sha }} .
          docker tag myappregistry.azurecr.io/budget-app:${{ github.sha }} \
            myappregistry.azurecr.io/budget-app:latest
          docker push budgetappacr.azurecr.io/budget-app:${{ github.sha }}
          docker push budgetappacr.azurecr.io/budget-app:latest

