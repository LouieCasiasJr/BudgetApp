name: Deploy to ACR

on:
  push:
    branches: [Main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v5

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/budget-app:${{ github.sha }} .
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/budget-app:${{ github.sha }} \
            ${{ secrets.ACR_LOGIN_SERVER }}/budget-app:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/budget-app:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/budget-app:latest

